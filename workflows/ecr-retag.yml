name: Retag ECR image (reusable)

on:
  workflow_call:
    inputs:
      repository:
        description: "ECR repository name"
        required: true
        type: string
      source_tag:
        description: "Existing tag to copy from"
        required: true
        type: string
      target_tag:
        description: "Tag to create"
        required: true
        type: string
      target_tag_pattern:
        description: "Regex the target_tag must match"
        required: false
        type: string
        default: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      role_to_assume:
        description: "IAM role ARN to assume for ECR access"
        required: true
        type: string
      aws_region:
        description: "AWS region of the ECR repository"
        required: false
        type: string
        default: eu-west-2
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target tag format
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
          PATTERN: ${{ inputs.target_tag_pattern }}
        run: |
          if [[ ! "$TARGET_TAG" =~ $PATTERN ]]; then
            echo "::error::target_tag '$TARGET_TAG' does not match required pattern '$PATTERN'"
            exit 1
          fi

  retag:
    needs: validate
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ${{ inputs.repository }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      TARGET_TAG: ${{ inputs.target_tag }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: Copy manifest
        uses: org/p-shared-workflow-example/actions/ecr-retag/ecr-copy-manifest@v1
        with:
          repository: ${{ env.REPOSITORY }}
          source_tag: ${{ env.SOURCE_TAG }}
          target_tag: ${{ env.TARGET_TAG }}

      - name: Verify tag
        uses: org/p-shared-workflow-example/actions/ecr-retag/ecr-verify-tag@v1
        with:
          repository: ${{ env.REPOSITORY }}
          tag: ${{ env.TARGET_TAG }}